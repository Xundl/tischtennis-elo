<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Leaderboard – Tischtennis Elo System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f5f5f5;
    }

    h1 {
      color: #222;
    }

    a {
      color: #3b2fc0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: white;
      margin: 6px 0;
      padding: 10px;
      border-radius: 8px;
    }

    .rank {
      font-style: italic;
      margin-left: 4px;
    }

    /* Rank-Farben (kopiert aus deiner index.html) */
    li.papier  { background: #e0e0e0; color: #222; }
    li.plastik { background: #d0f0ff; color: #004466; }
    li.holz    { background: #deb887; color: #4b2e05; }
    li.metall  { background: linear-gradient(90deg,#bbb,#eee); color: #222; }
    li.pfarrer {
      background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
      color: white;
      font-weight: bold;
      text-shadow: 1px 1px 2px black;
    }
    li.familie {
      background: linear-gradient(
        90deg,
        #003300,
        #006600,
        #009933,
        #00cc66,
        #003300
      );
      background-size: 300% 300%;
      color: #e6ffe6;
      font-weight: bold;
      border: 3px solid #00cc66;
      border-radius: 10px;
      text-shadow:
        0 0 6px rgba(0, 255, 128, 0.8),
        0 0 12px rgba(0, 200, 100, 0.6);
      animation: shimmerGreen 5s ease-in-out infinite;
    }

    @keyframes shimmerGreen {
      0% {
        background-position: 0% 50%;
        box-shadow: 0 0 10px rgba(0, 200, 100, 0.4), inset 0 0 6px rgba(0, 255, 150, 0.3);
      }
      50% {
        background-position: 100% 50%;
        box-shadow: 0 0 20px rgba(0, 255, 128, 0.9), inset 0 0 10px rgba(0, 255, 180, 0.6);
      }
      100% {
        background-position: 0% 50%;
        box-shadow: 0 0 10px rgba(0, 200, 100, 0.4), inset 0 0 6px rgba(0, 255, 150, 0.3);
      }
    }

    li.karl {
  background: linear-gradient(120deg, #fff8b0, #ffd700, #fff2cc, #ffdf80, #ffd700);
  background-size: 300% 300%;
  color: #000000ff;
  font-weight: bold;
  border: 3px solid #ffd700;
  border-radius: 10px;
  text-shadow:
    0 0 5px rgba(255, 215, 0, 0.8),
    0 0 15px rgba(255, 255, 150, 0.8);
  animation: goldGlow 4s ease-in-out infinite;
}

/* sanftes Leuchten + glänzende Bewegung */
@keyframes goldGlow {
  0% {
    background-position: 0% 50%;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.3), inset 0 0 8px rgba(255, 255, 150, 0.3);
  }
  50% {
    background-position: 100% 50%;
    box-shadow: 0 0 25px rgba(255, 230, 120, 0.8), inset 0 0 12px rgba(255, 255, 200, 0.6);
  }
  100% {
    background-position: 0% 50%;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.3), inset 0 0 8px rgba(255, 255, 150, 0.3);
  }
}

@keyframes goldShine {
  0%   { background-position: 0% 50%; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
  50%  { background-position: 100% 50%; text-shadow: 0 0 25px rgba(255, 255, 150, 1); }
  100% { background-position: 0% 50%; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); }
}

  /* etwas Abstand & Style */
  li { margin: 6px 0; padding: 10px; border-radius: 8px; }
  .rank { font-style: italic; margin-left: 4px; }

    li:has(.rank:contains("Karl Jindraks Doppelpartner")) {
      background: linear-gradient(90deg, #ffd700, #fff8b0);
      border: 2px solid gold;
      font-weight: bold;
    }

  </style>
</head>
<body>
  <h1>Gesamtes Leaderboard</h1>

  <a href="/" style="display:inline-block; margin-bottom:15px;">⬅️ Zurück zur Startseite</a>

  <ul>
    {% for p in players %}
      {% set rank_class = p.rank_name.split(' ')[0].lower() %}
      <li class="{{ rank_class }}">
        <b>{{ p.name }}</b> – Elo: {{ "%.0f"|format(p.elo) }} - <span class="rank">{{ p.rank_name }}</span>
        <a href="/edit_player/{{ p.id }}" style="margin-left:10px; font-size:0.9em;">EDIT</a>
      </li>
    {% endfor %}
  </ul>
</body>
</html>
